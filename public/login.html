  <meta name="theme-color" content="#0a0c10">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">

  <main class="container auth-page">
    <div class="auth-head">
      <span class="eyebrow"><span class="dot"></span>Личная страница игрока</span>
      <h1>Вход через <span class="grad">Chess.com</span></h1>

    </div>
    <div id="auth-alert" style="max-width:980px;margin:0 auto 20px"></div>
    <div class="auth-grid">
      <section class="card auth-card" id="oauth-card"></section>
      <section class="card auth-card" id="verify-card"></section>
