<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Настройки страницы · ChessRank</title>
  <meta name="theme-color" content="#0a0c10">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/me.js"></script>
</head>
<body>
  <main class="container settings-page" id="settings-root">
    <div class="skeleton" style="height:48px;width:320px;margin-bottom:24px"></div>
    <div class="settings-grid">
      <div class="skeleton" style="height:560px"></div>
      <div class="skeleton" style="height:320px"></div>
    </div>
  </main>
  <datalist id="openings">
    <option value="Сицилианская защита">
    <option value="Ферзевый гамбит">
    <option value="Итальянская партия">
    <option value="Испанская партия">
    <option value="Защита Каро-Канн">
    <option value="Французская защита">
    <option value="Лондонская система">
    <option value="Королевский гамбит">
    <option value="Староиндийская защита">
    <option value="Защита Грюнфельда">
    <option value="Английское начало">
    <option value="Шотландская партия">
    <option value="Скандинавская защита">
    <option value="Защита Пирца">
  </datalist>
</body>
</html>
